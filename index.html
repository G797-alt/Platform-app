<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uwashusema</title><style>body{margin:0;font-family:system-ui;background:#f1f5f1}header{background:#1a6d2f;color:#fff;padding:14px;text-align:center;font-weight:900}.card{background:#fff;margin:10px;border-radius:12px;padding:12px}h3{color:#1a6d2f;font-size:14px;border-bottom:1px solid #eee;padding-bottom:6px}.top3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.top3 div{padding:10px;border-radius:8px;text-align:center;color:#fff}.mapato{background:#2e7d32}.matumizi{background:#c62828}.salio{background:#1565c0}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px}.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:900;color:#fff;margin-top:6px}.green{background:#1a6d2f}.blue{background:#1565c0}.orange{background:#ef6c00}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#e8f5e9;padding:6px;text-align:left}td{padding:7px;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}</style></head><body>
<header>Uwashusema Mahida - 2023 hadi 2035 <small id="dbStatus" style="display:block;font-weight:400;font-size:11px;opacity:0.8">Postgres: Inaunganisha...</small></header>
<div class="card"><div style="display:flex;gap:6px"><select id="mwezi"><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">Mei</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Ago</option><option value="9">Sep</option><option value="10">Okt</option><option value="11">Nov</option><option value="12">Des</option></select><select id="mwaka"></select><button onclick="loadFromDB()" style="background:#1a6d2f;color:#fff;border:0;border-radius:6px;padding:0 12px">Sawa</button></div><div class="top3" style="margin-top:10px"><div class="mapato"><small>MAPATO</small><b id="tMapato">0</b></div><div class="matumizi"><small>MATUMIZI</small><b id="tMatumizi">0</b></div><div class="salio"><small>Bakaa</small><b id="tSalio">0</b></div></div></div>
<div class="card"><h3>Wanachama <button onclick="addW()" style="float:right;background:#1a6d2f;color:#fff;border:0;padding:4px 8px;border-radius:5px">+ Mpya</button></h3><div id="wlist"></div></div>
<div class="card"><h3>Ingiza Data</h3><select id="selW"></select><select id="selAina"><optgroup label="MAPATO"><option value="hisa">Hisa</option><option value="ada">Ada</option><option value="marejesho">Marejesho ya Mkopo</option><option value="faini">Faini</option><option value="fomu">Fomu</option><option value="michango">Michango</option></optgroup><optgroup label="MATUMIZI"><option value="mkopo_toka">Mkopo kwa Mwanachama</option><option value="dharura">Fedha ya Dharura</option><option value="mkono_pole">Mkono wa Pole</option><option value="matumizi_mengine">Matumizi Mengine</option></optgroup></select><input id="kiasi" type="number" placeholder="Kiasi"><input id="maelezo" placeholder="Maelezo"><button class="btn green" onclick="addM()">Hifadhi kwenye Postgres</button></div>
<div class="card"><h3>Wanaorudisha Mikopo</h3><table><thead><tr><th>Jina</th><th>Kiasi</th><th>✏️ / X</th></tr></thead><tbody id="tblRudisha"></tbody></table></div>
<div class="card"><h3>Wenye Deni la Mkopo</h3><table><thead><tr><th>Jina</th><th>Chukua</th><th>Rudisha</th><th>Baki</th><th>✏️</th></tr></thead><tbody id="tblDeni"></tbody></table></div>
<div class="card"><h3>Historia ya Mwezi Huu (kutoka DB)</h3><div id="hist"></div></div>
<div class="card"><h3>Hifadhi ya Kudumu & Tuma</h3><div id="muhtasari"></div><button class="btn orange" onclick="pakuaBackup()">💾 Pakua Backup ya Kudumu (JSON)</button><label class="btn blue" style="display:block;text-align:center">📂 Rudisha Backup<input type="file" id="fileIn" accept=".json" style="display:none" onchange="rudishaBackup(this)"></label><button class="btn green" style="background:#777" onclick="backup()">📊 Pakua Excel CSV</button><button class="btn green" onclick="wa()">📱 Tuma WhatsApp Ripoti</button></div>
<script>
let DATA={target:1200000,wanachama:[{jina:"Charles Joseph Mgaya"}],miamala:[]};
const API="/api";
async function loadFromDB(){
  try{
    let mw=+mwezi.value, yr=+mwaka.value;
    document.getElementById('dbStatus').textContent="Postgres: Inapakia "+mw+"/"+yr+"...";
    let [wRes, mRes] = await Promise.all([fetch(API+'/wanachama'), fetch(API+'/miamala?mwezi='+mw+'&mwaka='+yr)]);
    let wanachama = await wRes.json(); let miamala = await mRes.json();
    if(wanachama && wanachama.length>0){ DATA.wanachama = wanachama.map(x=>({jina:x.jina, id:x.id})); }
    DATA.miamalaDB = miamala;
    let allRes = await fetch(API+'/miamala'); let all = await allRes.json(); DATA.miamalaAll = all;
    DATA.miamala = miamala.map(m=>({w:m.jina, a:m.aina, k:m.kiasi, ma:m.maelezo, mwezi:m.mwezi, mwaka:m.mwaka, t:m.created_at || new Date().toLocaleString(), id:m.id }));
    if(DATA.miamala.length==0){
      let keys=['mahida_FULL','mahida_v3','mahida_final','mahida_vFinal'];
      for(let k of keys){ let d=localStorage.getItem(k); if(d){ try{ let f=JSON.parse(d); if(f && f.miamala && f.miamala.length>0){
        for(let mm of f.miamala){ await fetch(API+'/miamala',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mwezi:mm.mwezi,mwaka:mm.mwaka,jina:mm.w,aina:mm.a,kiasi:mm.k,maelezo:mm.ma||''})}); }
        for(let wc of f.wanachama){ await fetch(API+'/wanachama',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jina:wc.jina})}); }
        location.reload(); return;
      }}catch(e){}} }
    }
    document.getElementById('dbStatus').textContent="Postgres: Imeunganishwa ✓ - "+all.length+" miamala";
    render();
  }catch(e){
    document.getElementById('dbStatus').textContent="Postgres: localStorage - "+e.message;
    let keys=['mahida_FULL','mahida_v3','mahida_final','mahida_vFinal'];let found=null;for(let k of keys){let d=localStorage.getItem(k);if(d){try{found=JSON.parse(d);if(found&&found.miamala&&found.miamala.length>0)break}catch(e){}}}
    if(found) DATA=found; render();
  }
}
function initYear(){let sel=document.getElementById('mwaka');let cur=new Date().getFullYear();for(let y=2023;y<=2035;y++){let o=document.createElement('option');o.value=y;o.text=y;if(y==cur)o.selected=true;sel.appendChild(o)}}
async function addW(){let j=prompt('Jina:');if(!j)return; await fetch(API+'/wanachama',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jina:j})}); await loadFromDB();}
async function addM(){let w=selW.value,a=selAina.value,k=Number(kiasi.value),ma=maelezo.value;if(!w||!a||!k)return alert('Jaza'); await fetch(API+'/miamala',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mwezi:+mwezi.value,mwaka:+mwaka.value,jina:w,aina:a,kiasi:k,maelezo:ma})}); kiasi.value=''; maelezo.value=''; await loadFromDB(); alert('Imehifadhiwa Postgres!');}
async function editAt(id){ let rec = DATA.miamala.find(x=>x.id==id); let actualId = rec.id; let v=prompt('Kiasi kipya:', rec.k); if(v!==null&&v!==''){ await fetch(API+'/miamala?id='+actualId,{method:'DELETE'}); await fetch(API+'/miamala',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mwezi:rec.mwezi,mwaka:rec.mwaka,jina:rec.w,aina:rec.a,kiasi:Number(v),maelezo:rec.ma||''})}); await loadFromDB(); } }
async function delAt(id){ let rec = DATA.miamala.find(x=>x.id==id); let actualId = rec.id; if(confirm('Futa?')){ await fetch(API+'/miamala?id='+actualId,{method:'DELETE'}); await loadFromDB(); } }
function pakuaBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA)],{type:'application/json'}));a.download='BACKUP_Mahida_Kudumu.json';a.click()}
function rudishaBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async e=>{try{let d=JSON.parse(e.target.result); for(let wc of d.wanachama){ await fetch(API+'/wanachama',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jina:wc.jina})}); } for(let mm of d.miamala){ await fetch(API+'/miamala',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mwezi:mm.mwezi,mwaka:mm.mwaka,jina:mm.w||mm.jina,aina:mm.a||mm.aina,kiasi:mm.k||mm.kiasi,maelezo:mm.ma||mm.maelezo||''})}); } alert('Data imerudi Postgres!'); loadFromDB(); }catch(err){alert('File si sahihi '+err)}};r.readAsText(f)}
function render(){let m=+mwezi.value,y=+mwaka.value,mi=DATA.miamala.filter(x=>x.mwezi==m&&x.mwaka==y);let mapA=['hisa','ada','marejesho','faini','fomu','michango'],matA=['mkopo_toka','dharura','mkono_pole','matumizi_mengine'];let map=0,mat=0;mi.forEach(t=>{if(mapA.includes(t.a))map+=t.k;if(matA.includes(t.a))mat+=t.k});tMapato.textContent='TZS '+map.toLocaleString();tMatumizi.textContent='TZS '+mat.toLocaleString();tSalio.textContent='TZS '+(map-mat).toLocaleString();let wl=wlist;wl.innerHTML='';let sel=selW;sel.innerHTML='<option value="">Chagua</option>';DATA.wanachama.forEach((w,i)=>{wl.innerHTML+=`<div class="row"><b>${w.jina}</b><span><button style="border:0;background:#e3f2fd">✏️</button> <button onclick="if(confirm('Futa?')){ fetch('/api/wanachama?id=${w.id||i}',{method:'DELETE'}).then(()=>loadFromDB()) }" style="border:0;background:#ffebee;color:#c00">X</button></span></div>`;sel.innerHTML+=`<option>${w.jina}</option>`});let tr=tblRudisha;tr.innerHTML='';mi.filter(t=>t.a=='marejesho').forEach(t=>{tr.innerHTML+=`<tr><td>${t.w}</td><td>${t.k.toLocaleString()}</td><td><button onclick="editAt(${t.id})" style="background:#e3f2fd;border:0;padding:5px 8px;border-radius:5px">✏️</button> <button onclick="delAt(${t.id})" style="background:#ffebee;border:0;padding:5px 8px;border-radius:5px">X</button></td></tr>`});if(!tr.innerHTML)tr.innerHTML='<tr><td colspan=3 style="color:#999">Hakuna</td></tr>';let dmap={};let allM = DATA.miamalaAll || DATA.miamala; allM.forEach(t=>{let jn=t.jina||t.w; let aina=t.aina||t.a; let kiasi=t.kiasi||t.k; if(!dmap[jn])dmap[jn]={c:0,r:0,list:[]}; if(aina=='mkopo_toka'){dmap[jn].c+=kiasi; dmap[jn].list.push(t.id||0)} if(aina=='marejesho'){dmap[jn].r+=kiasi; dmap[jn].list.push(t.id||0)}});let td=tblDeni;td.innerHTML='';for(let j in dmap){let b=dmap[j].c-dmap[j].r;if(b>0){td.innerHTML+=`<tr><td>${j}</td><td>${dmap[j].c.toLocaleString()}</td><td>${dmap[j].r.toLocaleString()}</td><td style="color:#c00;font-weight:800">${b.toLocaleString()}</td><td><button style="background:#1a6d2f;color:#fff;border:0;padding:5px 8px;border-radius:5px">✏️</button></td></tr>`}}if(!td.innerHTML)td.innerHTML='<tr><td colspan=5 style="color:#999">Hakuna deni</td></tr>';let hi=hist;hi.innerHTML='';[...mi].reverse().slice(0,100).forEach(t=>{hi.innerHTML+=`<div class="row"><div><b>${t.w}</b> - ${t.a} - TZS ${t.k.toLocaleString()}<br><small>${t.t}</small></div><div><button onclick="editAt(${t.id})" style="border:0;background:#e3f2fd">✏️</button> <button onclick="delAt(${t.id})" style="border:0;background:#ffebee;color:#c00">X</button></div></div>`});if(!hi.innerHTML)hi.innerHTML='<div style="color:#999">Hakuna mwezi huu</div>';let mu=muhtasari;mu.innerHTML='';let sum={};document.querySelectorAll('#selAina option').forEach(o=>{if(o.value)sum[o.value]=0});mi.forEach(t=>sum[t.a]+=t.k);for(let k in sum){if(sum[k]>0)mu.innerHTML+=`<div class="row"><span>${k}</span><b>${sum[k].toLocaleString()}</b></div>`}}
function backup(){let csv='Mwezi,Mwaka,Jina,Aina,Kiasi\n';(DATA.miamalaAll||DATA.miamala).forEach(m=>{let mw=m.mwezi||m.mwezi; let yr=m.mwaka||m.mwaka; let jn=m.jina||m.w; let ai=m.aina||m.a; let ki=m.kiasi||m.k; csv+=`${mw},${yr},${jn},${ai},${ki}\n`});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mahida.csv';a.click()}
function wa(){let txt=`*Mahida* ${mwezi.value}/${mwaka.value} Mapato:${tMapato.textContent} Matumizi:${tMatumizi.textContent} Salio:${tSalio.textContent}`;window.open('https://wa.me/?text='+encodeURIComponent(txt))}
mwezi.value=new Date().getMonth()+1;initYear();loadFromDB();
</script></body></html>
